name: Harness

# Pull requests run the `pr` profile: everything except integration tests against the built
# server, which already run in-process. Pushes to master, the nightly run and manual runs
# cover everything.
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

env:
  HARNESS_PROFILE: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      setups: ${{ steps.list.outputs.setups }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - run: npm install
      # One job per folder in tests/setups, so a new setup needs no change here.
      - id: list
        run: echo "setups=$(node tests/harness/src/cli/index.ts list --json --profile $HARNESS_PROFILE)" >> "$GITHUB_OUTPUT"

  run:
    name: ${{ matrix.setup }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        setup: ${{ fromJson(needs.plan.outputs.setups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - run: npm install
      - run: npm run build
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      # The harness starts the Docker services the setup needs, such as Postgres.
      - name: Run the harness
        run: node tests/harness/src/cli/index.ts run --profile $HARNESS_PROFILE --setup ${{ matrix.setup }} --seed ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-${{ matrix.setup }}
          path: tests/.harness/runs
          include-hidden-files: true
          retention-days: 14

  report:
    name: Report
    needs: run
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          pattern: harness-*
          path: harness-reports

      # Writes the job summary, and fails when any setup failed.
      - name: Merge the reports
        run: node tests/harness/src/cli/index.ts merge harness-reports/*/*/report.json ${{ env.HARNESS_PROFILE == 'full' && '--complete' || '' }}

      # One comment per pull request, updated on each run, for reviewers and review agents to read.
      - uses: marocchino/sticky-pull-request-comment@v2
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        with:
          header: lucid-harness
          path: tests/.harness/latest/summary.md
